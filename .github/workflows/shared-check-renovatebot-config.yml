name: Shared check renovatebot config

on:
  workflow_call:
    inputs:
      config_file_path:
        description: Path to the Renovatebot config file to validate
        type: string
        required: true
      checkout_submodules:
        description: Whether to checkout submodules
        type: string
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  validate:
    name: Validate renovatebot config
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.checkout_submodules }}

      - name: Validate config
        uses: suzuki-shunsuke/github-action-renovate-config-validator@b850926b611b1f3d3fe3729776339c217834bf2c # v2.2.0
        with:
          config_file_path: ${{ inputs.config_file_path }}
