---
name: Build and publish Docker Image

on:
  workflow_call:
    inputs:
      acr_name:
        type: string
        default: crjore4prod001
      docker_image_name:
        type: string
        required: true
      file:
        description: Path to Dockerfile
        type: string
        required: false
        default: Dockerfile
      context:
        description: Docker build context. This needs to be Git repository context; see https://docs.docker.com/build/concepts/context/#url-fragments
        type: string
        required: false
        default: ""
      build_args:
        description: Docker build time arguments
        type: string
        required: false
        default: ""
      target:
        description: Sets the target stage to build
        type: string
        required: false
        default: ""
      build_arm64_image:
        description: Should arm64 Docker image be built
        type: boolean
        required: false
        default: false
    secrets:
      azure_tenant_id:
        required: true
      azure_subscription_id:
        required: true
      azure_client_id:
        required: true
    outputs:
      # Our own outputs
      docker_image:
        description: Docker image with tag
        value: ${{ jobs.set_variables.outputs.docker_image }}

      docker_image_tag:
        description: Tag of the generated images
        value: ${{ jobs.set_variables.outputs.docker_image_tag }}

permissions:
  id-token: write
  contents: read

jobs:
  set_variables:
    name: Generate image tags and names
    runs-on: ubuntu-slim
    outputs:
      docker_image_latest: ${{ steps.variables.outputs.docker_image_latest }}
      docker_image_cache: ${{ steps.variables.outputs.docker_image_cache }}
      docker_image: ${{ steps.variables.outputs.docker_image }}
      docker_image_tag: ${{ steps.variables.outputs.docker_image_tag }}
      build_outputs: ${{ steps.variables.outputs.build_outputs }}
      build_matrix: ${{ steps.variables.outputs.build_matrix }}
    steps:
      - name: Set variables
        id: variables
        shell: bash
        run: |
          # GITHUB_HEAD_REF is the source branch of a pull request
          # GITHUB_REF is the name of the branch or tag that triggered the workflow
          # i.e. for pull requests the branch name is read from GITHUB_HEAD_REF and for
          # branch/tag updates from GITHUB_REF
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF}}"

          # Strip refs/heads/ or refs/tags/ out
          ref_name=$(basename "${ref}")

          docker_image_tag=$(echo -n "${ref_name}" | tr -C '0-9a-zA-Z._' '-')-$(date +%Y-%m-%d)-${GITHUB_SHA}

          base_docker_image=${{ inputs.acr_name }}.azurecr.io/${{ inputs.docker_image_name }}
          echo "docker_image_latest=${base_docker_image}:latest" | tee -a "${GITHUB_OUTPUT}"
          echo "docker_image_cache=${base_docker_image}:cache" | tee -a "${GITHUB_OUTPUT}"
          echo "docker_image=${base_docker_image}:${docker_image_tag}" | tee -a "${GITHUB_OUTPUT}"
          echo "docker_image_tag=${docker_image_tag}" | tee -a "${GITHUB_OUTPUT}"
          
          # Setup Docker build action outputs declaration
          printf 'build_outputs=type=image,"name=%s",oci-artifact=true,push-by-digest=true,name-canonical=true,push=true\n' "$base_docker_image" | tee -a "${GITHUB_OUTPUT}"
          
          # Prepare the build matrix
          defineBuild() { printf '{ "platform": "%s", "runner": "%s" }' "$1" "$2"; }
          makeMatrix() { local IFS=','; printf 'build_matrix={ "include": [%s] }\n' "$*"; }
          
          runner_base='ubuntu-26.04'
          amd64=$(defineBuild 'linux/amd64' "${runner_base}")
          arm64=$(defineBuild 'linux/arm64' "${runner_base}-arm")

          if [[ '${{ inputs.build_arm64_image }}' = 'true' ]]; then
            makeMatrix "$amd64" "$arm64" | tee -a "${GITHUB_OUTPUT}"
          else
            makeMatrix "$amd64" | tee -a "${GITHUB_OUTPUT}"
          fi

  build_and_push_images:
    needs:
      - set_variables
    strategy:
      matrix: ${{ fromJSON(needs.set_variables.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    outputs:
      digest_linux_amd64: ${{ steps.result.outputs.digest_linux_amd64 }}
      digest_linux_arm64: ${{ steps.result.outputs.digest_linux_arm64 }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.azure_client_id }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          subscription-id: ${{ secrets.azure_subscription_id }}

      - name: Login to ACR via OIDC
        run: az acr login --name ${{ inputs.acr_name }}

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: ${{ inputs.build_args }}
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          labels: git_sha=${{ github.sha }}
          outputs: ${{ needs.set_variables.outputs.build_outputs }}
          platforms: ${{ matrix.platform }}
          target: ${{ inputs.target }}
          cache-from: type=registry,ref=${{ needs.set_variables.outputs.docker_image_cache }}
          cache-to: ${{ github.ref_name == 'main' && format('type=registry,ref={0},mode=max', needs.set_variables.outputs.docker_image_cache) || '' }}

      - name: Result
        id: result
        shell: bash
        run: |
          platform=$(echo "${{ matrix.platform }}" | tr '/' '_')
          echo "digest_${platform}=${{ steps.build.outputs.digest }}" | tee -a "${GITHUB_OUTPUT}"

  push_manifest:
    needs:
      - set_variables
      - build_and_push_images
    runs-on: ubuntu-26.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.azure_client_id }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          subscription-id: ${{ secrets.azure_subscription_id }}

      - name: Login to ACR via OIDC
        run: az acr login --name ${{ inputs.acr_name }}

      - name: Push manifest
        id: result
        shell: bash
        run: |
          cmd=(docker buildx imagetools create)
          
          tags=(
            "${{ needs.set_variables.outputs.docker_image }}"
            "${{ github.ref_name == 'main' && needs.set_variables.outputs.docker_image_latest || '' }}"
          )
          echo "Tags: ${tags}"
          
          for tag in "${tags[@]}"; do
            if [[ ! -z "$tag" ]]; then
              cmd+=(--tag "$tag")
            fi
          done
          
          digests=(
            "${{ needs.build_and_push_images.outputs.digest_linux_amd64 }}"
            "${{ needs.build_and_push_images.outputs.digest_linux_arm64 }}"
          )
          echo "Digests: ${digests}"
          
          for digest in "${digests[@]}"; do
            if [[ ! -z "$digest" ]]; then
              cmd+=("$digest")
            fi
          done
          
          "${cmd[@]}"
